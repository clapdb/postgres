# Standalone CI for the contrib/pagestore module.
#
# The pagestore daemon and its test harness are freestanding C (they include
# only pagestore_ipc.h and libc), so this runs WITHOUT building PostgreSQL --
# it just compiles the two programs and runs the test, which exercises the
# storage logic, COW versioning, segment rollover and crash recovery across
# page sizes 4K/8K/16K.  Seconds, not minutes.
name: pagestore

on:
  push:
    branches:
      - master
      - pagestore
      - 'branchdb_*'
    paths:
      - 'contrib/pagestore/**'
      # core seams the pagestore module depends on: a core-only PR (e.g. the
      # control-file write hook) must still run the in-engine tests
      - 'src/backend/access/transam/xlog.c'
      - 'src/backend/access/transam/xlogrecovery.c'
      - 'src/include/access/xlogrecovery.h'
      - 'src/backend/access/transam/slru.c'
      - 'src/backend/access/transam/xlogutils.c'
      - 'src/backend/access/heap/visibilitymap.c'
      - 'src/backend/postmaster/walredo.c'
      - 'src/backend/storage/smgr/**'
      - 'src/backend/storage/ipc/procarray.c'
      - 'src/backend/tcop/postgres.c'
      - 'src/include/access/xlog.h'
      - 'src/include/access/slru.h'
      - 'src/include/postmaster/walredo.h'
      - 'src/include/storage/smgr.h'
      - 'src/include/storage/procarray.h'
      - '.github/workflows/pagestore-test.yml'
  pull_request:
    paths:
      - 'contrib/pagestore/**'
      # core seams the pagestore module depends on: a core-only PR (e.g. the
      # control-file write hook) must still run the in-engine tests
      - 'src/backend/access/transam/xlog.c'
      - 'src/backend/access/transam/xlogrecovery.c'
      - 'src/include/access/xlogrecovery.h'
      - 'src/backend/access/transam/slru.c'
      - 'src/backend/access/transam/xlogutils.c'
      - 'src/backend/access/heap/visibilitymap.c'
      - 'src/backend/postmaster/walredo.c'
      - 'src/backend/storage/smgr/**'
      - 'src/backend/storage/ipc/procarray.c'
      - 'src/backend/tcop/postgres.c'
      - 'src/include/access/xlog.h'
      - 'src/include/access/slru.h'
      - 'src/include/postmaster/walredo.h'
      - 'src/include/storage/smgr.h'
      - 'src/include/storage/procarray.h'
      - '.github/workflows/pagestore-test.yml'
  workflow_dispatch:

# A branch update fires both push and pull_request.  Keep only the newest run
# for that branch so stacked-PR rebases do not consume the runner quota with
# obsolete standalone/integration jobs.
concurrency:
  group: pagestore-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  standalone-test:
    name: standalone daemon test (no PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile daemon and test harness
        working-directory: contrib/pagestore
        run: |
          cc -O2 -Wall -Wextra -Werror -o pagestore_daemon pagestore_daemon.c pagestore_core.c pagestore_fault.c storage_posix.c pagestore_layer.c pagestore_layer_store.c pagestore_manifest.c pagestore_memtable.c pagestore_pgcache.c pagestore_prune.c pagestore_retention.c pagestore_wal_store.c pagestore_wal_segment.c pagestore_walidx_prune.c pagestore_walidx_snapshot.c pagestore_forkmeta_prune.c pagestore_forkmeta_snapshot.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_inspect pagestore_inspect.c -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_test   pagestore_test.c   -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_layer_test pagestore_layer_test.c pagestore_layer.c pagestore_layer_store.c -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_layer_store_test pagestore_layer_store_test.c pagestore_layer_store.c pagestore_layer.c -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_tiering_test pagestore_tiering_test.c pagestore_core.c pagestore_fault.c storage_posix.c pagestore_layer.c pagestore_layer_store.c pagestore_manifest.c pagestore_memtable.c pagestore_pgcache.c pagestore_prune.c pagestore_retention.c pagestore_wal_store.c pagestore_wal_segment.c pagestore_walidx_prune.c pagestore_walidx_snapshot.c pagestore_forkmeta_prune.c pagestore_forkmeta_snapshot.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_forkmeta_cutover_test pagestore_forkmeta_cutover_test.c pagestore_core.c pagestore_fault.c storage_posix.c pagestore_layer.c pagestore_layer_store.c pagestore_manifest.c pagestore_memtable.c pagestore_pgcache.c pagestore_prune.c pagestore_retention.c pagestore_wal_store.c pagestore_wal_segment.c pagestore_walidx_prune.c pagestore_walidx_snapshot.c pagestore_forkmeta_prune.c pagestore_forkmeta_snapshot.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_forkmeta_crash_matrix_test pagestore_forkmeta_crash_matrix_test.c pagestore_core.c pagestore_fault.c storage_posix.c pagestore_layer.c pagestore_layer_store.c pagestore_manifest.c pagestore_memtable.c pagestore_pgcache.c pagestore_prune.c pagestore_retention.c pagestore_wal_store.c pagestore_wal_segment.c pagestore_walidx_prune.c pagestore_walidx_snapshot.c pagestore_forkmeta_prune.c pagestore_forkmeta_snapshot.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_pgcache_test pagestore_pgcache_test.c pagestore_pgcache.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_manifest_test pagestore_manifest_test.c pagestore_manifest.c pagestore_layer.c pagestore_layer_store.c -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_retention_test pagestore_retention_test.c pagestore_retention.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_gc_test pagestore_gc_test.c pagestore_core.c pagestore_fault.c storage_posix.c pagestore_layer.c pagestore_layer_store.c pagestore_manifest.c pagestore_memtable.c pagestore_pgcache.c pagestore_prune.c pagestore_retention.c pagestore_wal_store.c pagestore_wal_segment.c pagestore_walidx_prune.c pagestore_walidx_snapshot.c pagestore_forkmeta_prune.c pagestore_forkmeta_snapshot.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_walidx_prune_test pagestore_walidx_prune_test.c pagestore_walidx_prune.c -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_forkmeta_prune_test pagestore_forkmeta_prune_test.c pagestore_forkmeta_prune.c -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_walidx_snapshot_test pagestore_walidx_snapshot_test.c pagestore_walidx_snapshot.c -lrt
          cc -O2 -Wall -Wextra -Werror -o pagestore_forkmeta_snapshot_test pagestore_forkmeta_snapshot_test.c pagestore_forkmeta_snapshot.c -lrt
          cc -O2 -Wall -Wextra -Werror -o storage_posix_wal_test storage_posix_wal_test.c storage_posix.c -lrt -lpthread
          cc -O2 -Wall -Wextra -Werror -o pagestore_fault_test pagestore_fault_test.c pagestore_fault.c -pthread

      - name: Run standalone test suite
        working-directory: contrib/pagestore
        run: ./pagestore_test ./pagestore_daemon ./pagestore_inspect

      - name: Run named fault registry unit test
        working-directory: contrib/pagestore
        run: ./pagestore_fault_test

      - name: Run named fault recovery harness
        working-directory: contrib/pagestore
        run: |
          python3 harness/pagestore_harness.py \
            --capabilities harness/capabilities.json \
            --daemon-fault-recovery harness/scenarios/daemon_fault_recovery.jsonl \
            --daemon-binary ./pagestore_daemon \
            --inspect-binary ./pagestore_inspect

      - name: Run image-layer unit test
        working-directory: contrib/pagestore
        run: ./pagestore_layer_test

      - name: Run layer-store provider unit test
        working-directory: contrib/pagestore
        run: ./pagestore_layer_store_test

      - name: Run tiering integration test
        working-directory: contrib/pagestore
        run: ./pagestore_tiering_test

      - name: Run materialized-page cache unit test
        working-directory: contrib/pagestore
        run: ./pagestore_pgcache_test

      - name: Run manifest replay unit test
        working-directory: contrib/pagestore
        run: ./pagestore_manifest_test

      - name: Run retention registry unit test
        working-directory: contrib/pagestore
        run: ./pagestore_retention_test

      - name: Run GC crash-safety unit test
        working-directory: contrib/pagestore
        run: ./pagestore_gc_test

      - name: Run WAL-index snapshot publication unit test
        working-directory: contrib/pagestore
        run: ./pagestore_walidx_snapshot_test

      - name: Run forkmeta runtime cutover smoke
        working-directory: contrib/pagestore
        run: ./pagestore_forkmeta_cutover_test

      - name: Run forkmeta POSIX process-crash matrix
        working-directory: contrib/pagestore
        run: ./pagestore_forkmeta_crash_matrix_test

      - name: Run fork-metadata checkpoint snapshot unit test
        working-directory: contrib/pagestore
        run: ./pagestore_forkmeta_snapshot_test

      - name: Run WAL-index prune planning unit test
        working-directory: contrib/pagestore
        run: ./pagestore_walidx_prune_test

      - name: Run fork-metadata prune planning unit test
        working-directory: contrib/pagestore
        run: ./pagestore_forkmeta_prune_test

      - name: Run flat-WAL prefix rewrite unit test
        working-directory: contrib/pagestore
        run: ./storage_posix_wal_test

  # In-engine test: build PostgreSQL and exercise the real path (smgr hijack,
  # localsvc backend over the daemon, COW read_at, WAL shipping).  Heavier --
  # it compiles PostgreSQL -- so it is a separate job.
  integration-test:
    name: in-engine integration test (PostgreSQL + daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -name '*microsoft*' -o -name '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex meson ninja-build pkg-config perl python3

      - name: Configure and build PostgreSQL (minimal)
        run: |
          meson setup build -Dcassert=true -Dauto_features=disabled
          ninja -C build

      - name: Prepare temporary install tree
        run: meson test -C build --suite setup

      - name: Run pagestore harness writer smoke
        run: |
          python3 contrib/pagestore/harness/pagestore_harness.py \
            --capabilities contrib/pagestore/harness/capabilities.json \
            --writer-smoke contrib/pagestore/harness/scenarios/writer_lifecycle.jsonl \
            --build-dir "$(pwd)/build" \
            --daemon-binary "$(pwd)/build/contrib/pagestore/pagestore_daemon" \
            --inspect-binary "$(pwd)/build/contrib/pagestore/pagestore_inspect"

      - name: Run pagestore harness managed materializer smoke
        if: github.ref_name != 'branchdb_13' && github.ref_name != 'branchdb_14'
        run: |
          python3 contrib/pagestore/harness/pagestore_harness.py \
            --capabilities contrib/pagestore/harness/capabilities.json \
            --materializer-smoke contrib/pagestore/harness/scenarios/materializer_lifecycle.jsonl \
            --build-dir "$(pwd)/build" \
            --daemon-binary "$(pwd)/build/contrib/pagestore/pagestore_daemon" \
            --inspect-binary "$(pwd)/build/contrib/pagestore/pagestore_inspect" \
            --materializer-supervisor \
              "$(pwd)/contrib/pagestore/pagestore_materializer_supervisor.py"

      - name: Run H1 materializer crash after relation sync
        if: github.ref_name != 'branchdb_13' && github.ref_name != 'branchdb_14'
        run: |
          python3 contrib/pagestore/harness/pagestore_harness.py \
            --capabilities contrib/pagestore/harness/capabilities.json \
            --materializer-smoke \
              contrib/pagestore/harness/scenarios/materializer_restartpoint_after_relation_sync_before_marker.jsonl \
            --build-dir "$(pwd)/build" \
            --daemon-binary "$(pwd)/build/contrib/pagestore/pagestore_daemon" \
            --inspect-binary "$(pwd)/build/contrib/pagestore/pagestore_inspect" \
            --materializer-supervisor \
              "$(pwd)/contrib/pagestore/pagestore_materializer_supervisor.py"

      - name: Run H1 materializer crash after marker sync
        if: github.ref_name != 'branchdb_13' && github.ref_name != 'branchdb_14'
        run: |
          python3 contrib/pagestore/harness/pagestore_harness.py \
            --capabilities contrib/pagestore/harness/capabilities.json \
            --materializer-smoke \
              contrib/pagestore/harness/scenarios/materializer_restartpoint_after_marker_sync.jsonl \
            --build-dir "$(pwd)/build" \
            --daemon-binary "$(pwd)/build/contrib/pagestore/pagestore_daemon" \
            --inspect-binary "$(pwd)/build/contrib/pagestore/pagestore_inspect" \
            --materializer-supervisor \
              "$(pwd)/contrib/pagestore/pagestore_materializer_supervisor.py"

      - name: Run pagestore integration test
        run: contrib/pagestore/integration_test.sh "$(pwd)/build"

      - name: Run WAL-redo worker demo
        run: contrib/pagestore/redo_worker_demo.sh "$(pwd)/build"

      - name: Run WAL-only (non-redundant) redo demo
        run: contrib/pagestore/wal_only_redo_demo.sh "$(pwd)/build"

      - name: Run continuous WAL redo materializer demo
        run: contrib/pagestore/continuous_redo_demo.sh "$(pwd)/build"

      - name: Run composed pagestore MVP golden scenario
        run: contrib/pagestore/mvp_golden_test.sh "$(pwd)/build"

      - name: Run end-to-end branch boot test
        run: contrib/pagestore/branch_boot_test.sh "$(pwd)/build"
